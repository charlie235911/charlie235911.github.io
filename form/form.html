<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料填寫表單</title>
    <style>
        #signature-container {
            display: none;
            margin-top: 10px;
        }
        canvas {
            border: 2px solid black;
            touch-action: none;
        }
        #signed-message {
            display: none;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>請填寫以下資訊</h2>

    <form id="userForm" action="database.php" method="POST" enctype="multipart/form-data">
        <label>姓名：</label>
        <input type="text" name="name" required><br>

        <label>身分證字號：</label>
        <input type="text" name="id_number" required><br>

        <label>電子簽章：</label><br>
        <button type="button" onclick="showSignaturePad()">開始簽署</button>
        <span id="signed-message">已完成簽署</span>

        <div id="signature-container">
            <p>請在下方簽名：</p>
            <canvas id="signature-pad" width="400" height="200"></canvas><br>
            <button type="button" onclick="clearSignature()">清除簽名</button>
            <button type="button" onclick="saveSignature()">確認簽署</button>
        </div>
        <input type="hidden" id="signature-data" name="signature">

        <h3>請下載知情同意書</h3>
        <a href="知情同意書_20250206.docx" download>📄 知情同意書 (Word)</a><br>

        <label>上傳簽署後的同意書：</label>
        <input type="file" name="signed_agreement" accept=".doc,.docx" required><br>

        <button type="submit">提交</button>
    </form>

    <script>
        let isDrawing = false;
        let ctx, canvas;

        function showSignaturePad() {
            document.getElementById("signature-container").style.display = "block"; // 顯示簽名板
            canvas = document.getElementById("signature-pad");
            ctx = canvas.getContext("2d");

            // 滑鼠事件
            canvas.addEventListener("mousedown", startDrawing);
            canvas.addEventListener("mousemove", draw);
            canvas.addEventListener("mouseup", stopDrawing);
            canvas.addEventListener("mouseleave", stopDrawing);

            // 觸控事件
            canvas.addEventListener("touchstart", startDrawing);
            canvas.addEventListener("touchmove", draw);
            canvas.addEventListener("touchend", stopDrawing);
        }

        function startDrawing(event) {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(getX(event), getY(event));
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(event) {
            if (!isDrawing) return;
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.strokeStyle = "black";
            ctx.lineTo(getX(event), getY(event));
            ctx.stroke();
        }

        function getX(event) {
            return event.clientX ? event.clientX - canvas.offsetLeft : event.touches[0].clientX - canvas.offsetLeft;
        }

        function getY(event) {
            return event.clientY ? event.clientY - canvas.offsetTop : event.touches[0].clientY - canvas.offsetTop;
        }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById("signature-data").value = "";
        }

        function saveSignature() {
            let signatureData = canvas.toDataURL("image/png"); // 轉為 Base64
            document.getElementById("signature-data").value = signatureData;
            document.getElementById("signature-container").style.display = "none"; // 隱藏簽名板
            document.getElementById("signed-message").style.display = "inline"; // 顯示已完成簽署文字
            alert("簽名已儲存！");
        }
    </script>

</body>
</html>
